<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Paracadute: se JS è disabilitato, reindirizza dopo 1 secondo -->
    <meta http-equiv="refresh" content="1; url=https://delduca.vercel.app/">
    <title>Del Duca in caricamento...</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    
    <script>
        // Reindirizzamento immediato al nuovo repository dedicato
        window.location.href = "https://delduca.vercel.app/";
    </script>
</head>
<body>

    <div class="loader"></div>
    <p>Ti stiamo trasferendo a del duca...</p>
    <p>Se la pagina non si carica, <a href="https://delduca.vercel.app/">clicca qui</a>.</p>

</body>
</html>
